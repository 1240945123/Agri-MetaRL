# Agri-MetaRL 2.0: task-instance support memory + bounded residual correction
TomatoEnv:
  n_envs: 8
  total_timesteps: 2_000_000
  policy: MlpLstmPolicy
  n_steps: 2048
  batch_size: 512
  n_epochs: 8
  gamma: 0.9631
  gae_lambda: 0.9666
  clip_range: 0.2
  normalize_advantage: True
  ent_coef: 0.00006002718320795429
  vf_coef: 0.2599
  max_grad_norm: 0.3
  use_sde: False
  sde_sample_freq: 8
  target_kl: null
  learning_rate: 0.0001161

  policy_kwargs:
    net_arch: { pi: [1024, 1024], vf: [128, 128] }
    optimizer_class: adam
    optimizer_kwargs: { amsgrad: true }
    activation_fn: silu
    log_std_init: np.log(1)
    lstm_hidden_size: 256
    n_lstm_layers: 1
    shared_lstm: false
    enable_critic_lstm: true

  support_size: 256
  max_task_instances: 128
  context_dim: 64
  transition_hidden_dim: 128
  residual_alpha: 0.5
  meta_loss_weight: 1.0
  residual_regularization: 0.05
  max_pending_episodes: 32
  max_completed_episodes: 128
  calibration_min_query_samples: 32
  calibration_max_query_samples: 1024
  calibration_max_queue_samples: 16384
  constraint_penalty_weight: 0.05
  temp_violation_weight: 0.001
  co2_violation_weight: 0.0001
  rh_violation_weight: 0.0005
